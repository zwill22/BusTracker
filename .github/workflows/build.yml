name: Build BusTracker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-ios:
    runs-on: macos-latest
    strategy:
      matrix:
        iphone: ["11", "12", "13", "14", "15", "16", "17"]
  

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build BusTracker on iPhone {{matrix.iphone}} Simulator (iOS 26.5)
      run: |
        xcodebuild -scheme 'BusTracker' -destination 'platform=iOS Simulator,name=iPhone {{matrix.iphone}} OS=26.5'
